name: Veille IA Quotidienne

on:
  # Déclenchement automatique dès qu'un push arrive sur main
  push:
    branches: [ main ]
  # Déclenchement automatique tous les jours à 07h00 UTC (08h00 ou 09h00 heure de Paris)
  schedule:
    - cron: '0 7 * * *'
  # Permet également de tester et déclencher manuellement le bot en un clic depuis GitHub
  workflow_dispatch:

jobs:
  run-ia-news-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter le bot de veille
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py
